name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx astro check
      - name: Compiled API runtime
        run: |
          npx tsc api/game-run.ts api/leaderboard.ts --outDir "$RUNNER_TEMP/portfolio-api" --module NodeNext --moduleResolution NodeNext --target ES2022 --types node --skipLibCheck --ignoreConfig
          node --input-type=module <<'JS'
          const api = await import(`${process.env.RUNNER_TEMP}/portfolio-api/api/game-run.js`);
          const response = await api.POST(new Request('https://example.com/api/game-run', {
            method: 'POST', headers: { origin: 'https://wrong.example', 'content-type': 'application/json' }, body: '{}'
          }));
          if (response.status !== 403) throw new Error('Compiled API origin guard failed');
          JS
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      # Brief §10: Lighthouse 95+ on all four categories, mobile and desktop.
      # is-crawlable is skipped: the site is a private share and noindex on purpose.
      - name: Lighthouse budget
        run: |
          npx astro preview --port 4321 --ignore-lock &
          sleep 3
          for path in / /fx /fusion /winking-star /uoaui; do
            for preset in mobile desktop; do
              flag=""; [ "$preset" = desktop ] && flag="--preset=desktop"
              npx -y lighthouse@12 "http://localhost:4321$path" $flag --skip-audits=is-crawlable --quiet --chrome-flags="--headless=new --no-sandbox" --output=json --output-path=lh.json
              node -e "const c=require('./lh.json').categories;const low=Object.entries(c).filter(([,v])=>v.score<0.95);console.log('$path $preset',Object.fromEntries(Object.entries(c).map(([k,v])=>[k,Math.round(v.score*100)])));if(low.length){console.error('Below 95:',low.map(([k])=>k).join(', '));process.exit(1)}"
            done
          done
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-check-reports
          path: |
            test-results
            lh.json

  links:
    # Brief §10: every external link checked live. LinkedIn (HTTP 999) and the
    # App Store rate-limit bots, so they are excluded here and checked by hand
    # before each release (see README). Figma design links require sign-in and
    # reject the bot with 403; validate their file/node IDs through Figma MCP.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-retries 3 --timeout 20
            --exclude 'linkedin\.com' --exclude 'apps\.apple\.com'
            --exclude '^https://shannonhecker\.com'
            --exclude '^https://www\.figma\.com/design/'
            src/components/*.astro
          fail: true
