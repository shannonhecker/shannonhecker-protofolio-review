name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx astro check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: test-results }

  links:
    # Brief §10: every external link checked live. LinkedIn (HTTP 999) and the
    # App Store rate-limit bots, so they are excluded here and checked by hand
    # before each release (see README).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-retries 3 --timeout 20
            --exclude 'linkedin\.com' --exclude 'apps\.apple\.com'
            --exclude '^https://shannonhecker\.com'
            src/components/*.astro
          fail: true
