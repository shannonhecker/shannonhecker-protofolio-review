<text fill="#56616B" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="13" y="275.418">A light-theme tidy-up exposed </tspan><tspan x="13" y="298.618">hardcoded colours in the code, tokens </tspan><tspan x="13" y="321.818">and naming. I costed two options with </tspan><tspan x="13" y="345.018">product and engineering. We shipped </tspan><tspan x="13" y="368.218">features first, then phased the fix in the </tspan><tspan x="13" y="391.418">background, starting with the simple, </tspan><tspan x="13" y="414.618">single-themed blotter.</tspan></text>
