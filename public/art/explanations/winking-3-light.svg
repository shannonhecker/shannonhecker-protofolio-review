<text fill="#4F7352" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="14" letter-spacing="0em"><tspan x="41" y="231.591">Connection returns</tspan></text>
<text fill="#56616B" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="12" letter-spacing="0em"><tspan x="41" y="252.864">Sync the queued ticks to the family</tspan></text>
<path d="M17 287H321" stroke="#D6DCE1" stroke-width="1.5" stroke-linejoin="round"/>
<text fill="#56616B" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="12" letter-spacing="0em"><tspan x="17" y="306.864">Two adults can use the same child&#x2019;s board.</tspan></text>
<text fill="#56616B" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="12" letter-spacing="0em"><tspan x="17" y="325.864">Conflict-resolution rules are not specified.</tspan></text>
<text fill="#202932" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="20" font-weight="500" letter-spacing="0em"><tspan x="13" y="372.773">Offline, then reconnected</tspan></text>
<text fill="#56616B" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="13" y="411.418">An offline banner explains the state. </tspan><tspan x="13" y="434.618">Ticks queue and sync on reconnect. Two </tspan><tspan x="13" y="457.818">adults can tick the same child from two </tspan><tspan x="13" y="481.018">phones.</tspan></text>
