<text fill="#202932" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="20" font-weight="500" letter-spacing="0em"><tspan x="13" y="372.773">Accessible and calm</tspan></text>
<text fill="#56616B" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="13" y="411.418">VoiceOver reads tab labels and selected </tspan><tspan x="13" y="434.618">state. Dynamic Type supports text up to </tspan><tspan x="13" y="457.818">1.6&#xd7;. Reduce Motion or Calm Mode </tspan><tspan x="13" y="481.018">keeps confetti off.</tspan></text>
