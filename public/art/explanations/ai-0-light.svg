<text fill="#202932" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="20" font-weight="500" letter-spacing="0em"><tspan x="13" y="372.773">Draft &#x2192; compare &#x2192; tune</tspan></text>
<text fill="#56616B" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="13" y="411.418">I write the prompt. Claude drafts a </tspan><tspan x="13" y="434.618">screen, never the final answer. I compare </tspan><tspan x="13" y="457.818">and tune before exporting React a </tspan><tspan x="13" y="481.018">developer can inspect.</tspan></text>
