<text fill="#B8C0CA" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="13" y="275.418">I designed the token, density and theme </tspan><tspan x="13" y="298.618">mapping. It resolves system-specific </tspan><tspan x="13" y="321.818">props across Salt, Material, Fluent, </tspan><tspan x="13" y="345.018">Carbon and my own system. Published </tspan><tspan x="13" y="368.218">React components are used where </tspan><tspan x="13" y="391.418">available; missing equivalents use </tspan><tspan x="13" y="414.618">explicit markup fallbacks, alongside a </tspan><tspan x="13" y="437.818">class-based in-house system.</tspan></text>
