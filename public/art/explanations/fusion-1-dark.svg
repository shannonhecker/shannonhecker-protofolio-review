<text fill="#B8C0CA" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="13" y="411.418">FactSet supplies performance, </tspan><tspan x="13" y="434.618">attribution and risk data. The same </tspan><tspan x="13" y="457.818">widgets serve different cubes and </tspan><tspan x="13" y="481.018">permission levels. People configure their </tspan><tspan x="13" y="504.218">own dashboard pages; entitlements </tspan><tspan x="13" y="527.418">control what they see. Import and export </tspan><tspan x="13" y="550.618">run through FactSet.</tspan></text>
