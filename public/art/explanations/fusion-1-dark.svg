<text fill="#B8C0CA" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="13" y="275.418">FactSet supplies performance, </tspan><tspan x="13" y="298.618">attribution and risk data. The same </tspan><tspan x="13" y="321.818">widgets serve different cubes and </tspan><tspan x="13" y="345.018">permission levels. People configure their </tspan><tspan x="13" y="368.218">own dashboard pages; entitlements </tspan><tspan x="13" y="391.418">control what they see. Import and export </tspan><tspan x="13" y="414.618">run through FactSet.</tspan></text>
