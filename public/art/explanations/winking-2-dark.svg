<svg width="336" height="504" viewBox="0 0 336 504" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect x="0.5" y="0.5" width="335" height="503" rx="3.5" fill="#222933"/>
<rect x="0.5" y="0.5" width="335" height="503" rx="3.5" stroke="#46515F"/>
<text fill="#B8C0CA" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="12" letter-spacing="0em"><tspan x="17" y="33.8636">LOCAL DEVICE TIME &#xb7; iOS 1.0.4 FIX</tspan></text>
<path d="M302 51H36C33.2386 51 31 53.2386 31 56V104C31 106.761 33.2386 109 36 109H302C304.761 109 307 106.761 307 104V56C307 53.2386 304.761 51 302 51Z" fill="#222933" stroke="#46515F"/>
<text fill="#EDF0F4" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="14" letter-spacing="0em"><tspan x="41" y="73.5909">Before local midnight</tspan></text>
<text fill="#B8C0CA" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="12" letter-spacing="0em"><tspan x="41" y="94.8636">App is open on the current day</tspan></text>
<path d="M169 109V130M173 124L169 130L165 124" stroke="#B9D5B8" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M302 130H36C33.2386 130 31 132.239 31 135V183C31 185.761 33.2386 188 36 188H302C304.761 188 307 185.761 307 183V135C307 132.239 304.761 130 302 130Z" fill="#222933" stroke="#46515F"/>
<text fill="#EDF0F4" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="14" letter-spacing="0em"><tspan x="41" y="152.591">The local date changes</tspan></text>
<text fill="#B8C0CA" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="12" letter-spacing="0em"><tspan x="41" y="173.864">Refresh the day without reopening</tspan></text>
<path d="M169 188V209M173 203L169 209L165 203" stroke="#B9D5B8" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M302 209H36C33.2386 209 31 211.239 31 214V262C31 264.761 33.2386 267 36 267H302C304.761 267 307 264.761 307 262V214C307 211.239 304.761 209 302 209Z" fill="#222933" stroke="#B9D5B8" stroke-width="1.5"/>
<text fill="#B9D5B8" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="14" letter-spacing="0em"><tspan x="41" y="231.591">A late tick uses the right day</tspan></text>
<text fill="#B8C0CA" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="12" letter-spacing="0em"><tspan x="41" y="252.864">Avoid leaving the board on yesterday</tspan></text>
<path d="M17 287H321" stroke="#46515F" stroke-width="1.5" stroke-linejoin="round"/>
<text fill="#B8C0CA" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="12" letter-spacing="0em"><tspan x="17" y="306.864">Midnight here means local, not UTC.</tspan></text>
<text fill="#B8C0CA" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="12" letter-spacing="0em"><tspan x="17" y="325.864">Illustrates the shipped rollover fix.</tspan></text>
<text fill="#EDF0F4" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="20" font-weight="500" letter-spacing="0em"><tspan x="13" y="372.773">Local midnight</tspan></text>
<text fill="#B8C0CA" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="13" y="411.418">The day rolls over at local midnight, even </tspan><tspan x="13" y="434.618">while the app is open, so a late tick lands </tspan><tspan x="13" y="457.818">on the right day. Shipped as a fix in iOS </tspan><tspan x="13" y="481.018">1.0.4.</tspan></text>
</svg>
