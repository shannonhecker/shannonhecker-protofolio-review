<text fill="#B8C0CA" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="12" letter-spacing="0em"><tspan x="17" y="306.864">A quiet day does not erase earlier effort.</tspan></text>
<text fill="#B8C0CA" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="12" letter-spacing="0em"><tspan x="17" y="325.864">No reset or punishment is implied.</tspan></text>
<text fill="#EDF0F4" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="20" font-weight="500" letter-spacing="0em"><tspan x="13" y="372.773">A missed day</tspan></text>
<text fill="#B8C0CA" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="16" letter-spacing="0em"><tspan x="13" y="411.418">Fewer stars, never negative stars or red </tspan><tspan x="13" y="434.618">warnings. The pet keeps the growth </tspan><tspan x="13" y="457.818">earned from routines already completed.</tspan></text>
